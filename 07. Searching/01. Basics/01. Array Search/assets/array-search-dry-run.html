<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Search dry run</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Array Search · Dry run</p><h1>Linear scan, x found at index 4</h1><div class="diagram-container">
<svg viewBox="0 0 960 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="array-search-dry-run-title array-search-dry-run-desc">
<title id="array-search-dry-run-title">Array Search dry run</title>
<desc id="array-search-dry-run-desc">Linear scan of [10, 8, 30, 4, 5] for x = 5 checks indices 0 to 3 without a match and returns 4 at the first match.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">DRY RUN · ARR = [10, 8, 30, 4, 5] · X = 5</text>
<line x1="120" y1="264" x2="676" y2="264" stroke="#4f5d73" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="328" y="272" width="144" height="16" fill="#ffffff"/>
<text x="400" y="284" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="middle" letter-spacing="0.06em">SCAN LEFT TO RIGHT</text>
<line x1="680" y1="168" x2="726" y2="168" stroke="#0066cc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="176" y="124" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 0</text>
<rect x="120" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="176" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">10</text>
<text x="176" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">≠ 5</text>
<text x="288" y="124" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 1</text>
<rect x="232" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="288" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">8</text>
<text x="288" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">≠ 5</text>
<text x="400" y="124" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 2</text>
<rect x="344" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="400" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">30</text>
<text x="400" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">≠ 5</text>
<text x="512" y="124" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 3</text>
<rect x="456" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="512" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">4</text>
<text x="512" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">≠ 5</text>
<text x="624" y="124" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#0066cc" text-anchor="middle">i = 4</text>
<rect x="568" y="136" width="112" height="64" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="624" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0066cc" text-anchor="middle">5</text>
<text x="624" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">= 5  MATCH</text>
<rect x="728" y="132" width="168" height="72" rx="6" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="744" y="154" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0066cc" text-anchor="start" letter-spacing="0.14em">RESULT</text>
<text x="744" y="178" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0066cc" text-anchor="start">return 4</text>
<text x="744" y="194" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">5 comparisons</text>
<line x1="56" y1="320" x2="904" y2="320" stroke="#cecfcf"/>
<rect x="56" y="340" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34"/><rect x="200" y="340" width="24" height="16" fill="rgba(0,102,204,0.08)" stroke="#0066cc"/>
<text x="92" y="351" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">CHECKED, NO MATCH</text><text x="236" y="351" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">FIRST MATCH</text>
<text x="904" y="352" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">The first match met from the left is the answer.</text>
</svg>
</div></div></body></html>
