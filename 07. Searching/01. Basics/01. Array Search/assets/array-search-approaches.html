<!DOCTYPE html>

<title>Array Search approach map</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Array Search · Approaches</p><h1>Where each approach lands</h1><div class="diagram-container">
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="array-search-approaches-title array-search-approaches-desc">
<title id="array-search-approaches-title">Array Search approach map</title>
<desc id="array-search-approaches-desc">For a single query, the linear scan is the only approach with O(n) time, early exit and O(1) extra space; the other three use more time, more space, or both.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">ONE QUERY · TIME VS EXTRA SPACE</text>
<line x1="336" y1="96" x2="336" y2="440" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="336" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n), early exit</text>
<line x1="512" y1="96" x2="512" y2="440" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="512" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n), full scan</text>
<line x1="704" y1="96" x2="704" y2="440" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="704" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n log n)</text>
<line x1="176" y1="392" x2="816" y2="392" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="160" y="395" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(1)</text>
<line x1="176" y1="268" x2="816" y2="268" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="160" y="271" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(k)</text>
<line x1="176" y1="144" x2="816" y2="144" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="160" y="147" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(n)</text>
<line x1="176" y1="440" x2="816" y2="440" stroke="#161f34"/><line x1="176" y1="96" x2="176" y2="440" stroke="#161f34"/>
<text x="496" y="492" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">TIME FOR ONE QUERY  (WORSE TO THE RIGHT)</text>
<text x="56" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">EXTRA SPACE  (WORSE UPWARD)</text>
<rect x="348" y="376" width="146" height="36" fill="#ffffff"/>
<circle cx="336" cy="392" r="8" fill="#ffffff"/>
<circle cx="336" cy="392" r="8" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="2"/>
<text x="352" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0066cc" text-anchor="start">Linear scan</text>
<text x="352" y="406" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · O(1) best case</text>
<rect x="524" y="252" width="148" height="36" fill="#ffffff"/>
<circle cx="512" cy="268" r="6" fill="#ffffff"/>
<circle cx="512" cy="268" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="528" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Collect all matches</text>
<text x="528" y="282" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 1</text>
<rect x="524" y="128" width="177" height="36" fill="#ffffff"/>
<circle cx="512" cy="144" r="6" fill="#ffffff"/>
<circle cx="512" cy="144" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="528" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Value → first-index map</text>
<text x="528" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 2</text>
<rect x="716" y="128" width="199" height="36" fill="#ffffff"/>
<circle cx="704" cy="144" r="6" fill="#ffffff"/>
<circle cx="704" cy="144" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="720" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Sort pairs + binary search</text>
<text x="720" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 3</text>
<line x1="56" y1="512" x2="904" y2="512" stroke="#cecfcf"/>
<text x="904" y="540" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Lower left is better. Only the linear scan gets there.</text>
</svg>
</div></div></body></html>
