<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Early exit vs collect all</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Array Search · Brute force vs optimal</p><h1>Early exit vs collecting every match</h1><div class="diagram-container">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="array-search-early-exit-title array-search-early-exit-desc">
<title id="array-search-early-exit-title">Early exit vs collect all</title>
<desc id="array-search-early-exit-desc">On [4, 9, 4, 9, 2] with x = 9, collecting all matches reads 5 cells and stores two indices, while the early-exit scan reads 2 cells and returns 1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">SAME INPUT · ARR = [4, 9, 4, 9, 2] · X = 9</text>
<text x="316" y="92" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 0</text>
<text x="404" y="92" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 1</text>
<text x="492" y="92" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 2</text>
<text x="580" y="92" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 3</text>
<text x="668" y="92" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 4</text>
<text x="56" y="128" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">APPROACH 1</text>
<text x="56" y="146" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="start">Collect all matches</text>
<rect x="272" y="104" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="316" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">4</text>
<rect x="360" y="104" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="2"/>
<text x="404" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">9</text>
<rect x="448" y="104" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="492" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">4</text>
<rect x="536" y="104" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="2"/>
<text x="580" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">9</text>
<rect x="624" y="104" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="668" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">2</text>
<text x="744" y="128" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="start">5 reads</text>
<text x="744" y="146" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">stores [1, 3]</text>
<text x="56" y="224" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0066cc" text-anchor="start" letter-spacing="0.14em">OPTIMAL</text>
<text x="56" y="242" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">Early-exit scan</text>
<rect x="272" y="200" width="88" height="56" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="316" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#161f34" text-anchor="middle">4</text>
<rect x="360" y="200" width="88" height="56" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="404" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0066cc" text-anchor="middle">9</text>
<rect x="449" y="201" width="86" height="54" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="492" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#cecfcf" text-anchor="middle">4</text>
<rect x="537" y="201" width="86" height="54" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="580" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#cecfcf" text-anchor="middle">9</text>
<rect x="625" y="201" width="86" height="54" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="668" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#cecfcf" text-anchor="middle">2</text>
<text x="744" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">2 reads</text>
<text x="744" y="242" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">stores nothing</text>
<text x="580" y="276" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#40668d" text-anchor="middle">never read</text>
<line x1="56" y1="328" x2="904" y2="328" stroke="#cecfcf"/>
<rect x="56" y="352" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34"/><rect x="176" y="352" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="2"/><rect x="304" y="352" width="24" height="16" fill="rgba(0,102,204,0.08)" stroke="#0066cc"/><rect x="448" y="353" width="22" height="14" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="92" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">READ</text><text x="212" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">MATCH STORED</text><text x="340" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">RETURNED</text><text x="484" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">NOT READ</text>
<text x="904" y="364" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Both return 1. Early exit skips 3 reads.</text>
</svg>
</div></div></body></html>
