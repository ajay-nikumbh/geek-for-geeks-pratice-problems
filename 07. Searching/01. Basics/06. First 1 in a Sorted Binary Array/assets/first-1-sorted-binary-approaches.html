</head><body><div class="frame"><p class="eyebrow">First 1 in a Sorted Binary Array · Approaches</p><h1>Where each approach lands</h1><div class="diagram-container">

<title id="first-1-sorted-binary-approaches-title">First 1 approach map</title>
<desc id="first-1-sorted-binary-approaches-desc">Iterative lower-bound binary search alone reaches O(log n) time with O(1) space; the recursive version needs O(log n) stack and the linear scan and zero count need O(n) time.</desc>

<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">TIME VS EXTRA SPACE</text>
<line x1="352" y1="96" x2="352" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="352" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(log n)</text>
<line x1="640" y1="96" x2="640" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="640" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n)</text>
<line x1="176" y1="360" x2="816" y2="360" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="160" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(1)</text>
<line x1="176" y1="184" x2="816" y2="184" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="160" y="187" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(log n)</text>
<line x1="176" y1="424" x2="816" y2="424" stroke="#161f34" stroke-width="1"/>
<line x1="176" y1="96" x2="176" y2="424" stroke="#161f34" stroke-width="1"/>
<text x="496" y="476" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">TIME  (WORSE TO THE RIGHT)</text>
<text x="56" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">EXTRA SPACE  (WORSE UPWARD)</text>
<rect x="364" y="344" width="192" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="352" cy="360" r="8" fill="#ffffff"/>
<circle cx="352" cy="360" r="8" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="2"/>
<text x="368" y="358" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0066cc" text-anchor="start">Lower-bound binary search</text>
<text x="368" y="374" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · same as bisect_left</text>
<rect x="364" y="168" width="163" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="352" cy="184" r="6" fill="#ffffff"/>
<circle cx="352" cy="184" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="368" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Recursive lower bound</text>
<text x="368" y="198" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">call stack depth log n</text>
<rect x="652" y="344" width="192" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="640" cy="360" r="6" fill="#ffffff"/>
<circle cx="640" cy="360" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="656" y="358" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Linear scan / count zeros</text>
<text x="656" y="374" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approaches 1 and 2</text>

<text x="904" y="524" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Lower left is better. Sortedness buys the log.</text>
