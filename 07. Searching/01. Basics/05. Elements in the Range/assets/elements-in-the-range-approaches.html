</head><body><div class="frame"><p class="eyebrow">Elements in the Range · Approaches</p><h1>Where each approach lands</h1><div class="diagram-container">

<title id="elements-in-the-range-approaches-title">Elements in the Range approach map</title>
<desc id="elements-in-the-range-approaches-desc">Counting in-range values is O(n) time and O(1) space; the hash set needs O(n) space, sorting a copy costs O(n log n), and searching per value costs O(m·n).</desc>

<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">TIME VS EXTRA SPACE</text>
<line x1="312" y1="96" x2="312" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="312" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n)</text>
<line x1="472" y1="96" x2="472" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="472" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n + m)</text>
<line x1="632" y1="96" x2="632" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="632" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n log n)</text>
<line x1="776" y1="96" x2="776" y2="424" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="776" y="448" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(m · n)</text>
<line x1="176" y1="360" x2="816" y2="360" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="160" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(1)</text>

<text x="160" y="187" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(n)</text>
<line x1="176" y1="424" x2="816" y2="424" stroke="#161f34" stroke-width="1"/>
<line x1="176" y1="96" x2="176" y2="424" stroke="#161f34" stroke-width="1"/>
<text x="496" y="476" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">TIME  (WORSE TO THE RIGHT)</text>
<text x="56" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">EXTRA SPACE  (WORSE UPWARD)</text>

<text x="328" y="374" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · needs distinct</text>
<rect x="484" y="168" width="141" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="472" cy="184" r="6" fill="#ffffff"/>
<circle cx="472" cy="184" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="488" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Hash set of values</text>
<text x="488" y="198" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 3</text>

<text x="648" y="198" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 2</text>
<rect x="587" y="344" width="177" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="776" cy="360" r="6" fill="#ffffff"/>
<circle cx="776" cy="360" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>

<text x="760" y="374" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">Approach 1</text>
<text x="632" y="196" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle"></text>
<line x1="56" y1="496" x2="904" y2="496" stroke="#cecfcf" stroke-width="1"/>
<text x="904" y="524" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Lower left is better. Distinct values make counting enough.</text>
</svg>
