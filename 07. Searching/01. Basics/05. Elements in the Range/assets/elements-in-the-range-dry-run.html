<text x="704" y="284" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0066cc" text-anchor="start" letter-spacing="0.14em">RESULT</text>

<line x1="56" y1="380" x2="904" y2="380" stroke="#cecfcf" stroke-width="1"/>
<rect x="56" y="397" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="2"/>

<rect x="232" y="397" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
