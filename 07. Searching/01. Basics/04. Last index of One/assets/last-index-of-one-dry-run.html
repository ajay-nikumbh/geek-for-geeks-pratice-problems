<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Index of One dry run</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Last Index of One · Dry run</p><h1>Reverse scan, first '1' from the right at index 4</h1><div class="diagram-container">
<svg viewBox="0 0 960 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="last-index-of-one-dry-run-title last-index-of-one-dry-run-desc">
<title id="last-index-of-one-dry-run-title">Last Index of One dry run</title>
<desc id="last-index-of-one-dry-run-desc">Reverse scan of "0101100" reads index 6 and 5 (both '0'), finds '1' at index 4 and returns 4; indices 0 to 3 are never read.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">DRY RUN · S = "0101100" · SCAN FROM THE RIGHT</text>
<text x="308" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 0</text>
<rect x="265" y="137" width="86" height="62" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="308" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#cecfcf" text-anchor="middle">0</text>
<text x="396" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 1</text>
<rect x="353" y="137" width="86" height="62" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="396" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#cecfcf" text-anchor="middle">1</text>
<text x="484" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 2</text>
<rect x="441" y="137" width="86" height="62" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="484" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#cecfcf" text-anchor="middle">0</text>
<text x="572" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 3</text>
<rect x="529" y="137" width="86" height="62" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="572" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#cecfcf" text-anchor="middle">1</text>
<text x="660" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 4</text>
<rect x="616" y="136" width="88" height="64" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="660" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0066cc" text-anchor="middle">1</text>
<text x="660" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">read 3rd · '1'</text>
<text x="748" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 5</text>
<rect x="704" y="136" width="88" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="748" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">0</text>
<text x="748" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">read 2nd · '0'</text>
<text x="836" y="122" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 6</text>
<rect x="792" y="136" width="88" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="836" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">0</text>
<text x="836" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">read 1st · '0'</text>
<text x="440" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#40668d" text-anchor="middle">never read</text>
<line x1="880" y1="264" x2="624" y2="264" stroke="#4f5d73" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="668" y="272" width="128" height="16" fill="#ffffff"/>
<text x="732" y="284" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="middle" letter-spacing="0.06em">SCAN RIGHT TO LEFT</text>
<rect x="56" y="132" width="168" height="72" rx="6" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="72" y="154" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0066cc" text-anchor="start" letter-spacing="0.14em">RESULT</text>
<text x="72" y="178" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0066cc" text-anchor="start">return 4</text>
<text x="72" y="194" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">3 reads of 7</text>
<line x1="56" y1="320" x2="904" y2="320" stroke="#cecfcf"/>
<rect x="56" y="340" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34"/>
<text x="92" y="351" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">READ, NOT '1'</text>
<rect x="212" y="340" width="24" height="16" fill="rgba(0,102,204,0.08)" stroke="#0066cc"/>
<text x="248" y="351" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">FIRST '1' FROM RIGHT</text>
<rect x="412" y="341" width="22" height="14" fill="#ffffff" stroke="#cecfcf" stroke-dasharray="4,3"/>
<text x="448" y="351" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">NEVER READ</text>
<text x="904" y="352" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">The first '1' met from the right is the last '1'.</text>
</svg>
</div></div></body></html>
