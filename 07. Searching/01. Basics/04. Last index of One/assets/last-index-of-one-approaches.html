<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Index of One approach map</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Last Index of One · Approaches</p><h1>Where each approach lands</h1><div class="diagram-container">
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="last-index-of-one-approaches-title last-index-of-one-approaches-desc">
<title id="last-index-of-one-approaches-title">Last Index of One approach map</title>
<desc id="last-index-of-one-approaches-desc">The reverse scan (and s.rfind) stops at the last '1' with O(1) extra space; the forward running-state scan always reads all n characters, and collecting every index also needs O(k) space.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">ONE STRING · READS VS EXTRA SPACE</text>
<line x1="336" y1="96" x2="336" y2="440" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="336" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">stops at last '1'</text>
<line x1="624" y1="96" x2="624" y2="440" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="624" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">always reads all n</text>
<line x1="176" y1="392" x2="816" y2="392" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="160" y="395" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(1)</text>
<line x1="176" y1="176" x2="816" y2="176" stroke="#cecfcf" stroke-dasharray="2,4"/>
<text x="160" y="179" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(k)</text>
<line x1="176" y1="440" x2="816" y2="440" stroke="#161f34"/><line x1="176" y1="96" x2="176" y2="440" stroke="#161f34"/>
<text x="496" y="492" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">CHARACTERS READ  (MORE TO THE RIGHT)</text>
<text x="56" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">EXTRA SPACE  (MORE UPWARD)</text>
<rect x="348" y="376" width="176" height="36" fill="#ffffff"/>
<circle cx="336" cy="392" r="8" fill="#ffffff"/>
<circle cx="336" cy="392" r="8" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="2"/>
<text x="352" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0066cc" text-anchor="start">Reverse scan</text>
<text x="352" y="406" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · s.rfind('1') too</text>
<rect x="636" y="376" width="150" height="36" fill="#ffffff"/>
<circle cx="624" cy="392" r="6" fill="#ffffff"/>
<circle cx="624" cy="392" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="640" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Forward, track last</text>
<text x="640" y="406" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 2</text>
<rect x="636" y="160" width="150" height="36" fill="#ffffff"/>
<circle cx="624" cy="176" r="6" fill="#ffffff"/>
<circle cx="624" cy="176" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>
<text x="640" y="174" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Collect every index</text>
<text x="640" y="190" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 1</text>
<line x1="56" y1="512" x2="904" y2="512" stroke="#cecfcf"/>
<text x="904" y="540" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Lower left is better. Only the reverse scan gets there.</text>
</svg>
</div></div></body></html>
