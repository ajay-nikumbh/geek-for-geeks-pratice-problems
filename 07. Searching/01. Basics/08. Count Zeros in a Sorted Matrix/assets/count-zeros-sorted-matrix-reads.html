<!DOCTYPE html>

<title>Worst-case reads at n = 1000</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Count Zeros in a Sorted Matrix · Approaches</p><h1>Cells read at the largest input</h1><div class="diagram-container">
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="count-zeros-sorted-matrix-reads-title count-zeros-sorted-matrix-reads-desc">
<title id="count-zeros-sorted-matrix-reads-title">Worst-case reads at n = 1000</title>
<desc id="count-zeros-sorted-matrix-reads-desc">At n = 1000, the staircase walk reads at most 1,999 cells, a binary search per row about 10,000, and reading every cell 1,000,000.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">WORST-CASE CELLS READ · N = 1000 (THE CONSTRAINT)</text>
<line x1="304.0" y1="96" x2="304.0" y2="352" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="304.0" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">10^3</text>
<line x1="482.66666666666663" y1="96" x2="482.66666666666663" y2="352" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="482.66666666666663" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">10^4</text>
<line x1="661.3333333333333" y1="96" x2="661.3333333333333" y2="352" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="661.3333333333333" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">10^5</text>
<line x1="840.0" y1="96" x2="840.0" y2="352" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="840.0" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">10^6</text>
<line x1="304" y1="352" x2="840" y2="352" stroke="#161f34" stroke-width="1"/>
<text x="56" y="134" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">Staircase walk</text>
<text x="56" y="152" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · O(n)</text>
<rect x="304" y="120" width="53" height="36" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="369" y="143" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0066cc" text-anchor="start">1,999</text>
<text x="56" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="start">Binary search per row</text>
<text x="56" y="232" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">O(n log n)</text>
<rect x="304" y="200" width="178" height="36" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="494" y="223" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">10,000</text>
<text x="56" y="294" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="start">Read every cell</text>
<text x="56" y="312" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">O(n²)</text>
<rect x="304" y="280" width="536" height="36" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="852" y="303" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">1,000,000</text>
<text x="572" y="408" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">CELLS READ  (LOG SCALE)</text>
<line x1="56" y1="432" x2="904" y2="432" stroke="#cecfcf" stroke-width="1"/>
<text x="904" y="460" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">500 times fewer reads than the brute force.</text>
</svg>
