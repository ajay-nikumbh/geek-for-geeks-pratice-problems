<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Equal to Position dry run</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#ffffff;color:#161f34;padding:3rem 2rem}.frame{max-width:960px;margin:0 auto}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4f5d73;margin-bottom:.5rem}h1{font-size:1.75rem;font-weight:700;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style>
</head><body><div class="frame"><p class="eyebrow">Value Equal to Position · Dry run</p><h1>Single pass, positions 2 and 4 match</h1><div class="diagram-container">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="value-equal-to-position-dry-run-title value-equal-to-position-dry-run-desc">
<title id="value-equal-to-position-dry-run-title">Value Equal to Position dry run</title>
<desc id="value-equal-to-position-dry-run-desc">Single pass over [15, 2, 45, 4, 7]: each value is compared with its 1-based position i + 1; positions 2 and 4 match, so the result list grows to [2, 4].</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d73"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066cc"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">DRY RUN · ARR = [15, 2, 45, 4, 7] · 1-BASED POSITIONS</text>
<text x="176" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 0</text>
<text x="176" y="120" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">pos = 1</text>
<rect x="120" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="176" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">15</text>
<text x="176" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">15 ≠ 1</text>
<text x="176" y="252" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">res = []</text>
<text x="288" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 1</text>
<text x="288" y="120" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">pos = 2</text>
<rect x="232" y="136" width="112" height="64" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="288" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0066cc" text-anchor="middle">2</text>
<text x="288" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">2 = 2  MATCH</text>
<text x="288" y="252" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="500" fill="#161f34" text-anchor="middle">res = [2]</text>
<text x="400" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 2</text>
<text x="400" y="120" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">pos = 3</text>
<rect x="344" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="400" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">45</text>
<text x="400" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">45 ≠ 3</text>
<text x="400" y="252" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">res = [2]</text>
<text x="512" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 3</text>
<text x="512" y="120" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">pos = 4</text>
<rect x="456" y="136" width="112" height="64" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="512" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0066cc" text-anchor="middle">4</text>
<text x="512" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0066cc" text-anchor="middle">4 = 4  MATCH</text>
<text x="512" y="252" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="500" fill="#161f34" text-anchor="middle">res = [2, 4]</text>
<text x="624" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">i = 4</text>
<text x="624" y="120" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">pos = 5</text>
<rect x="568" y="136" width="112" height="64" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/>
<text x="624" y="174" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#161f34" text-anchor="middle">7</text>
<text x="624" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">7 ≠ 5</text>
<text x="624" y="252" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">res = [2, 4]</text>
<line x1="120" y1="280" x2="676" y2="280" stroke="#4f5d73" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="320" y="288" width="160" height="16" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="400" y="300" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="middle" letter-spacing="0.06em">SCAN LEFT TO RIGHT</text>
<line x1="680" y1="168" x2="726" y2="168" stroke="#0066cc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="728" y="132" width="168" height="72" rx="6" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="744" y="154" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0066cc" text-anchor="start" letter-spacing="0.14em">RESULT</text>
<text x="744" y="178" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0066cc" text-anchor="start">return [2, 4]</text>
<text x="744" y="194" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">5 comparisons</text>
<line x1="56" y1="336" x2="904" y2="336" stroke="#cecfcf" stroke-width="1"/>
<rect x="56" y="356" width="24" height="16" fill="rgba(22,31,52,0.05)" stroke="#161f34" stroke-width="1"/><rect x="216" y="356" width="24" height="16" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="1"/>
<text x="92" y="367" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">CHECKED, NO MATCH</text>
<text x="252" y="367" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d73" text-anchor="start" letter-spacing="0.06em">MATCH, POSITION APPENDED</text>
<text x="904" y="368" font-family="'Instrument Serif', serif" font-size="14" font-weight="400" fill="#4f5d73" text-anchor="end" font-style="italic">Compare arr[i] with i + 1, never with i.</text>
</svg>
</div></div></body></html>
