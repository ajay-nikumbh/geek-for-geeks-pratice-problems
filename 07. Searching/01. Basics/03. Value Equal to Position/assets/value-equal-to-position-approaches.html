</head><body><div class="frame"><p class="eyebrow">Value Equal to Position · Approaches</p><h1>Where each approach lands</h1><div class="diagram-container">
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="value-equal-to-position-approaches-title value-equal-to-position-approaches-desc">
<title id="value-equal-to-position-approaches-title">Value Equal to Position approach map</title>
<desc id="value-equal-to-position-approaches-desc">The single pass is the only approach with O(n) time and O(1) extra space; the nested search costs O(n squared) time and the value-to-positions map costs O(n) extra space.</desc>

<rect width="100%" height="100%" fill="#ffffff"/>
<text x="56" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#4f5d73" text-anchor="start" letter-spacing="0.18em">TIME VS EXTRA SPACE · OUTPUT LIST NOT COUNTED</text>
<line x1="400" y1="96" x2="400" y2="440" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="400" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n)</text>
<line x1="688" y1="96" x2="688" y2="440" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="688" y="464" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="middle">O(n²)</text>
<line x1="176" y1="392" x2="816" y2="392" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="160" y="395" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(1)</text>
<line x1="176" y1="160" x2="816" y2="160" stroke="#cecfcf" stroke-width="1" stroke-dasharray="2,4"/>
<text x="160" y="163" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="end">O(n)</text>
<line x1="176" y1="440" x2="816" y2="440" stroke="#161f34" stroke-width="1"/><line x1="176" y1="96" x2="176" y2="440" stroke="#161f34" stroke-width="1"/>
<text x="496" y="492" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="middle" letter-spacing="0.14em">TIME  (WORSE TO THE RIGHT)</text>
<text x="56" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#4f5d73" text-anchor="start" letter-spacing="0.14em">EXTRA SPACE  (WORSE UPWARD)</text>
<rect x="412" y="376" width="136" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="400" cy="392" r="8" fill="#ffffff"/>
<circle cx="400" cy="392" r="8" fill="rgba(0,102,204,0.08)" stroke="#0066cc" stroke-width="2"/>

<text x="416" y="406" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">optimal · Approach 3</text>

<circle cx="400" cy="160" r="6" fill="#ffffff"/>

<text x="416" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#161f34" text-anchor="start">Value → positions map</text>
<text x="416" y="174" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 2</text>
<rect x="700" y="376" width="110" height="36" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="688" cy="392" r="6" fill="#ffffff"/>
<circle cx="688" cy="392" r="6" fill="#ffffff" stroke="#161f34" stroke-width="1.5"/>

<text x="704" y="406" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" font-weight="400" fill="#4f5d73" text-anchor="start">Approach 1</text>
